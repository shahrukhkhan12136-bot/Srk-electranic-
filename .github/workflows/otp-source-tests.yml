name: Customer OTP source regression tests

on:
  push:
    branches:
      - feature/platform-fee-cash-online-cycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otp-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/platform-fee-cash-online-cycle
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run OTP source regression tests
        run: npm run test:otp
