name: SRK ELECTRONIC source regression tests

on:
  push:
    branches:
      - feature/platform-fee-cash-online-cycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/platform-fee-cash-online-cycle
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run all isolated source regression suites
        run: |
          npm run test:otp
          npm run test:labour
          npm run test:booking
          npm run test:application
          npm run test:payments
          npm run test:timeline
          npm run test:customer-menu
          npm run test:electrician-portal
