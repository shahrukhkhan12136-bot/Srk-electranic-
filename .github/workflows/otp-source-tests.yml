name: Customer OTP source regression tests

on:
  push:
    branches:
      - feature/platform-fee-cash-online-cycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otp-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/platform-fee-cash-online-cycle
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run OTP source regression tests
        run: npm run test:otp
