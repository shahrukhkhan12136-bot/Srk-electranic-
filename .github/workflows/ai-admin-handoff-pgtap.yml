name: AI Main Admin and Staff handoff workflow pgTAP

on:
  push:
    branches:
      - feat/ai-rate-management-foundation-20261118
    paths:
      - "COMPLETE_DATABASE_SETUP.sql"
      - "supabase/migrations/**"
      - "docs/AI_CONVERSATION_AND_HANDOFF_DATA_MODEL_HI.md"
      - "supabase/tests/database/ai_admin_handoff_queue_read.test.sql"
      - "supabase/tests/database/ai_handoff_individual_staff_permissions.test.sql"
      - "supabase/tests/database/ai_handoff_staff_workflow.test.sql"
      - ".github/workflows/ai-admin-handoff-pgtap.yml"
  pull_request:
    paths:
      - "COMPLETE_DATABASE_SETUP.sql"
      - "supabase/migrations/**"
      - "supabase/tests/database/ai_admin_handoff_queue_read.test.sql"
      - "supabase/tests/database/ai_handoff_individual_staff_permissions.test.sql"
      - "supabase/tests/database/ai_handoff_staff_workflow.test.sql"
      - ".github/workflows/ai-admin-handoff-pgtap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-ai-admin-handoff-pgtap
  cancel-in-progress: false

jobs:
  pgtap:
    name: Replay schema and run Main Admin and Staff assertions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Initialize temporary Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-ai-admin-pgtap"
          cd "$RUNNER_TEMP/srk-ai-admin-pgtap"
          supabase init

      - name: Start disposable local Supabase stack
        working-directory: ${{ runner.temp }}/srk-ai-admin-pgtap
        run: supabase start

      - name: Replay baseline and feature migrations locally
        working-directory: ${{ runner.temp }}/srk-ai-admin-pgtap
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/COMPLETE_DATABASE_SETUP.sql"
          mapfile -t migrations < <(find "$GITHUB_WORKSPACE/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying $(basename "$migration")"
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Enable pgTAP and run queue, permissions, and Staff workflow assertions
        working-directory: ${{ runner.temp }}/srk-ai-admin-pgtap
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          run_pgtap() {
            local file="$1"
            local expected_plan="$2"
            local output
            output="$({ echo 'SET search_path = public, extensions;'; cat "$GITHUB_WORKSPACE/$file"; } | docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1)" || { echo "$output"; return 1; }
            printf '%s\n' "$output"
            if echo "$output" | grep -Eq 'not ok [0-9]+|Looks like you failed [1-9]'; then
              echo "pgTAP reported failed assertions in $file."
              return 1
            fi
            if ! echo "$output" | grep -Fq "1..$expected_plan"; then
              echo "Expected pgTAP plan 1..$expected_plan was not found in $file."
              return 1
            fi
          }
          run_pgtap "supabase/tests/database/ai_admin_handoff_queue_read.test.sql" 13
          run_pgtap "supabase/tests/database/ai_handoff_individual_staff_permissions.test.sql" 17
          run_pgtap "supabase/tests/database/ai_handoff_staff_workflow.test.sql" 18

      - name: Stop disposable local Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}/srk-ai-admin-pgtap
        run: supabase stop --no-backup
