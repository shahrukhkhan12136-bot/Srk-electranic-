permissions:
  contents: read

jobs:
  postgres-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check customer, electrician and Admin inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const file of ['index.html', 'electrician.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match, index) => new vm.Script(match[1], { filename: file + '#inline-' + index }));
            console.log(file + ': ' + scripts.length + ' inline script(s) passed syntax check');
          }
          NODE
      - name: Check server-side payment handlers and Netlify adapters
        run: |
          node --check create-order.js
          node --check verify-payment.js
          node --check razorpay-webhook.js
          node --check create-snapshot-order.js
          node --check verify-snapshot-payment.js
          node --check netlify/functions/create-snapshot-order.js
          node --check netlify/functions/verify-snapshot-payment.js
      - name: Create minimal synthetic baseline
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_foundation_harness.sql
      - name: Apply foundation migration on clean schema
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110001_timer_billing_materials_foundation.sql
      - name: Verify safe second application
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110001_timer_billing_materials_foundation.sql
      - name: Verify RLS, grants, constraints and circular bill linkage
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_foundation_assertions.sql
      - name: Apply integrity extension migration
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110002_timer_billing_integrity_extensions.sql
      - name: Verify integrity extension migration is replay-safe
