name: Timer billing SQL tests

on:
  pull_request:
    paths:
      - "supabase/migrations/202611110001_timer_billing_materials_foundation.sql"
      - "supabase/migrations/202611110002_timer_billing_integrity_extensions.sql"
      - "supabase/migrations/202611110003_customer_approved_timer_rpcs.sql"
      - "supabase/migrations/202611110004_scoped_timer_bill_read_rpc.sql"
      - "supabase/migrations/202611110005_server_authoritative_booking_creation.sql"
      - "supabase/migrations/202611110006_preserve_labour_calculation_precision.sql"
      - "supabase/migrations/202611110007_material_revision_customer_approval_rpcs.sql"
      - "supabase/migrations/202611110008_customer_payable_snapshot_rpc.sql"
      - "supabase/migrations/202611110009_razorpay_snapshot_order_ledger.sql"
      - "supabase/migrations/202611110009_razorpay_snapshot_order_ledger.sql"
      - "supabase/migrations/202611110008_customer_payable_snapshot_rpc.sql"
      - "supabase/tests/material_revision_customer_approval_assertions.sql"
      - "supabase/tests/timer_billing_math.sql"
      - "supabase/tests/timer_billing_foundation_harness.sql"
      - "supabase/tests/timer_billing_foundation_assertions.sql"
      - "supabase/tests/timer_billing_integrity_extensions_assertions.sql"
      - "supabase/tests/customer_approved_timer_rpcs_assertions.sql"
      - "supabase/tests/server_authoritative_booking_creation_assertions.sql"
      - "index.html"
      - "electrician.html"
      - "admin.html"
      - "create-order.js"
      - "verify-payment.js"
      - "razorpay-webhook.js"
      - "create-snapshot-order.js"
      - "verify-snapshot-payment.js"
      - "netlify.toml"
      - "netlify/functions/create-snapshot-order.js"
      - "netlify/functions/verify-snapshot-payment.js"
      - ".github/workflows/timer-billing-math.yml"
  push:
    branches:
      - "feature/production-push-notifications"
    paths:
      - "supabase/migrations/202611110001_timer_billing_materials_foundation.sql"
      - "supabase/migrations/202611110002_timer_billing_integrity_extensions.sql"
      - "supabase/migrations/202611110003_customer_approved_timer_rpcs.sql"
      - "supabase/migrations/202611110004_scoped_timer_bill_read_rpc.sql"
      - "supabase/migrations/202611110005_server_authoritative_booking_creation.sql"
      - "supabase/migrations/202611110006_preserve_labour_calculation_precision.sql"
      - "supabase/migrations/202611110007_material_revision_customer_approval_rpcs.sql"
      - "supabase/migrations/202611110008_customer_payable_snapshot_rpc.sql"
      - "supabase/migrations/202611110009_razorpay_snapshot_order_ledger.sql"
      - "supabase/tests/material_revision_customer_approval_assertions.sql"
      - "index.html"
      - "admin.html"
      - "create-order.js"
      - "verify-payment.js"
      - "razorpay-webhook.js"
      - "create-snapshot-order.js"
      - "verify-snapshot-payment.js"
      - "netlify.toml"
      - "netlify/functions/create-snapshot-order.js"
      - "netlify/functions/verify-snapshot-payment.js"
      - "electrician.html"
      - "supabase/tests/server_authoritative_booking_creation_assertions.sql"
      - "supabase/tests/timer_billing_math.sql"
      - "supabase/tests/timer_billing_foundation_harness.sql"
      - "supabase/tests/timer_billing_foundation_assertions.sql"
      - "supabase/tests/timer_billing_integrity_extensions_assertions.sql"
      - "supabase/tests/customer_approved_timer_rpcs_assertions.sql"
      - ".github/workflows/timer-billing-math.yml"

permissions:
  contents: read

jobs:
  postgres-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check customer, electrician and Admin inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const file of ['index.html', 'electrician.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match, index) => new vm.Script(match[1], { filename: file + '#inline-' + index }));
            console.log(file + ': ' + scripts.length + ' inline script(s) passed syntax check');
          }
          NODE
      - name: Check server-side payment handlers and Netlify adapters
        run: |
          node --check create-order.js
          node --check verify-payment.js
          node --check razorpay-webhook.js
          node --check create-snapshot-order.js
          node --check verify-snapshot-payment.js
          node --check netlify/functions/create-snapshot-order.js
          node --check netlify/functions/verify-snapshot-payment.js
      - name: Create minimal synthetic baseline
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_foundation_harness.sql
      - name: Apply foundation migration on clean schema
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110001_timer_billing_materials_foundation.sql
      - name: Verify safe second application
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110001_timer_billing_materials_foundation.sql
      - name: Verify RLS, grants, constraints and circular bill linkage
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_foundation_assertions.sql
      - name: Apply integrity extension migration
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110002_timer_billing_integrity_extensions.sql
      - name: Verify integrity extension migration is replay-safe
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110002_timer_billing_integrity_extensions.sql
      - name: Verify material revisions, payable snapshots and webhook idempotency
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_integrity_extensions_assertions.sql
      - name: Apply customer-approved timer RPC migration
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110003_customer_approved_timer_rpcs.sql
      - name: Verify timer RPC migration is replay-safe
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
