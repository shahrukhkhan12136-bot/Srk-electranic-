            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110005_server_authoritative_booking_creation.sql
      - name: Test server-authoritative booking creation and category rates
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
