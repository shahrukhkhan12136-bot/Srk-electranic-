name: Timer billing SQL tests

on:
  pull_request:
    paths:
      - "supabase/migrations/202611110001_timer_billing_materials_foundation.sql"
      - "supabase/migrations/202611110002_timer_billing_integrity_extensions.sql"
      - "supabase/migrations/202611110003_customer_approved_timer_rpcs.sql"
      - "supabase/migrations/202611110004_scoped_timer_bill_read_rpc.sql"
      - "supabase/tests/timer_billing_math.sql"
      - "supabase/tests/timer_billing_foundation_harness.sql"
      - "supabase/tests/timer_billing_foundation_assertions.sql"
      - "supabase/tests/timer_billing_integrity_extensions_assertions.sql"
      - "supabase/tests/customer_approved_timer_rpcs_assertions.sql"
      - ".github/workflows/timer-billing-math.yml"
  push:
    branches:
      - "feature/production-push-notifications"
    paths:
      - "supabase/migrations/202611110001_timer_billing_materials_foundation.sql"
      - "supabase/migrations/202611110002_timer_billing_integrity_extensions.sql"
      - "supabase/migrations/202611110003_customer_approved_timer_rpcs.sql"
      - "supabase/tests/timer_billing_math.sql"
      - "supabase/tests/timer_billing_foundation_harness.sql"
      - "supabase/tests/timer_billing_foundation_assertions.sql"
      - "supabase/tests/timer_billing_integrity_extensions_assertions.sql"
      - "supabase/tests/customer_approved_timer_rpcs_assertions.sql"
      - ".github/workflows/timer-billing-math.yml"

permissions:
  contents: read

jobs:
  postgres-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create minimal synthetic baseline
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_foundation_harness.sql
      - name: Apply foundation migration on clean schema
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110001_timer_billing_materials_foundation.sql
      - name: Verify safe second application
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110001_timer_billing_materials_foundation.sql
      - name: Verify RLS, grants, constraints and circular bill linkage
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_foundation_assertions.sql
      - name: Apply integrity extension migration
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110002_timer_billing_integrity_extensions.sql
      - name: Verify integrity extension migration is replay-safe
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110002_timer_billing_integrity_extensions.sql
      - name: Verify material revisions, payable snapshots and webhook idempotency
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_integrity_extensions_assertions.sql
      - name: Apply customer-approved timer RPC migration
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110003_customer_approved_timer_rpcs.sql
      - name: Verify timer RPC migration is replay-safe
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110003_customer_approved_timer_rpcs.sql
      - name: Apply scoped timer and bill read RPC migration
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110004_scoped_timer_bill_read_rpc.sql
      - name: Verify scoped read RPC migration is replay-safe
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/202611110004_scoped_timer_bill_read_rpc.sql
      - name: Test customer-approved timer lifecycle and bill calculation
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/customer_approved_timer_rpcs_assertions.sql
      - name: Run rollback-only billing arithmetic tests
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_test" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/timer_billing_math.sql
