name: Synthetic Razorpay and Admin regression tests
# Includes isolated tests for refund webhook reconciliation and Admin-triggered refund requests.

on:
  push:
    branches:
      - work/separate-customer-electrician-portals
    paths:
      - "razorpay-webhook.js"
      - "razorpay-refund.js"
      - "create-order.js"
      - "verify-payment.js"
      - "tests/razorpay-webhook.synthetic.test.js"
      - "tests/razorpay-payment-functions.synthetic.test.js"
      - "tests/admin-direct-assignment.static.test.js"
      - "tests/complaints.static.test.js"
      - "tests/electrician-verification.static.test.js"
      - "tests/admin-audit-log.static.test.js"
      - "tests/razorpay-refund.static.test.js"
      - "tests/razorpay-refund-webhook.synthetic.test.js"
      - "tests/razorpay-refund-handler.synthetic.test.js"
      - "tests/parse_direct_assignment_migration.py"
      - "supabase/migrations/20261110030000_admin_direct_electrician_assignment.sql"
      - "supabase/migrations/20261110040000_customer_admin_complaints.sql"
      - "supabase/migrations/20261110050000_electrician_verification_documents.sql"
      - "supabase/migrations/20261110060000_admin_audit_log.sql"
      - "supabase/migrations/20261110070000_razorpay_refund_workflow.sql"
      - "electrician.html"
      - "index.html"
      - "admin.html"
      - "netlify.toml"
      - ".github/workflows/synthetic-webhook-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-payment-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check payment test syntax
        run: node --check tests/razorpay-payment-functions.synthetic.test.js
      - name: Run isolated synthetic webhook tests
        run: node tests/razorpay-webhook.synthetic.test.js
      - name: Run synthetic Razorpay refund webhook tests
        run: node tests/razorpay-refund-webhook.synthetic.test.js
      - name: Run synthetic Admin Razorpay refund handler tests
        run: node tests/razorpay-refund-handler.synthetic.test.js
      - name: Check synthetic refund test syntax
        run: node --check tests/razorpay-refund-handler.synthetic.test.js
      - name: Run isolated synthetic payment function tests
        run: node tests/razorpay-payment-functions.synthetic.test.js
      - name: Check direct-assignment test syntax
        run: node --check tests/admin-direct-assignment.static.test.js
      - name: Run complaints static security and UI tests
        run: node tests/complaints.static.test.js
      - name: Run electrician verification static security and UI tests
        run: node tests/electrician-verification.static.test.js
      - name: Run Admin audit log static security and UI tests
        run: node tests/admin-audit-log.static.test.js
      - name: Run Razorpay refund static security and safety tests
        run: node tests/razorpay-refund.static.test.js
      - name: Check Razorpay refund function syntax
        run: node --check razorpay-refund.js
      - name: Run direct-assignment static regression tests
        run: node tests/admin-direct-assignment.static.test.js
      - name: Set up Python for PostgreSQL parser
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PostgreSQL parser
        run: python -m pip install pglast
      - name: Parse direct-assignment migration SQL
        run: python tests/parse_direct_assignment_migration.py
