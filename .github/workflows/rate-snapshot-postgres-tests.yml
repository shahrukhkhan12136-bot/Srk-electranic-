name: Rate List booking snapshot isolated PostgreSQL tests

on:
  push:
    branches:
      - feat/ai-rate-management-foundation-20261118
    paths:
      - "supabase/migrations/20261118*.sql"
      - "supabase/tests/database/booking_rate_snapshot_immutability.test.sql"
      - ".github/workflows/rate-snapshot-postgres-tests.yml"
  pull_request:
    paths:
      - "supabase/migrations/20261118*.sql"
      - "supabase/tests/database/booking_rate_snapshot_immutability.test.sql"
      - ".github/workflows/rate-snapshot-postgres-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Share the local Supabase lock with the other disposable PostgreSQL workflows.
concurrency:
  group: srk-ai-postgres-draft-tests-global
  cancel-in-progress: false

jobs:
  booking-rate-snapshot:
    name: Verify immutable booking rate snapshots in disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Initialize isolated local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-rate-snapshot-db"
          cd "$RUNNER_TEMP/srk-rate-snapshot-db"
          supabase init
          sed -i 's/^\([[:space:]]*port = \)54321$/\154321/' supabase/config.toml
          sed -i 's/^\([[:space:]]*port = \)54322$/\157432/' supabase/config.toml
          sed -i 's/^\([[:space:]]*shadow_port = \)54320$/\157430/' supabase/config.toml

      - name: Start disposable local Supabase database
        working-directory: ${{ runner.temp }}/srk-rate-snapshot-db
        run: supabase start

      - name: Enable pgTAP and create the minimum booking fixture
        working-directory: ${{ runner.temp }}/srk-rate-snapshot-db
        run: |
          set -euo pipefail
          supabase db query --local "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.service_bookings (
            id uuid primary key default gen_random_uuid(),
            selected_category text,
            selected_duration_hours integer,
            selected_rate_tier text,
            estimated_labour_paise bigint,
            estimate_rate_card_version uuid,
            booking_status text
          );
          SQL

      - name: Apply booking snapshot guard migration locally only
        working-directory: ${{ runner.temp }}/srk-rate-snapshot-db
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/supabase/migrations/20261118090000_enforce_booking_rate_snapshot_immutability.sql"

      - name: Run all 15 booking snapshot pgTAP assertions
        working-directory: ${{ runner.temp }}/srk-rate-snapshot-db
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          OUTPUT="$(docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/supabase/tests/database/booking_rate_snapshot_immutability.test.sql" 2>&1)" || { printf '%s\n' "$OUTPUT"; exit 1; }
          printf '%s\n' "$OUTPUT"
          if printf '%s\n' "$OUTPUT" | grep -Eq 'not ok [0-9]+|Looks like you failed [1-9]'; then
            echo "pgTAP reported failed assertions."
            exit 1
          fi

      - name: Stop disposable local database
        if: always()
        working-directory: ${{ runner.temp }}/srk-rate-snapshot-db
        run: supabase stop --no-backup
