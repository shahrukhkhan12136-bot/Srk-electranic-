name: Atomic Razorpay payment-order isolated pgTAP

on:
  workflow_dispatch:
  push:
    branches: [feature/platform-fee-cash-online-cycle]
    paths:
      - '.github/workflows/payment-order-isolated-pgtap.yml'
      - 'supabase/migrations/20261114090000_atomic_razorpay_order_and_payment_finalization.sql'
      - 'supabase/tests/fixtures/payment_order_bootstrap.sql'
      - 'supabase/tests/database/atomic_razorpay_order_and_payment_finalization.test.sql'
      - 'supabase/tests/database/atomic_razorpay_order_behavior.test.sql'

permissions:
  contents: read

concurrency:
  group: srk-payment-order-pgtap
  cancel-in-progress: true

jobs:
  isolated-pgtap:
    if: github.ref == 'refs/heads/feature/platform-fee-cash-online-cycle'
    name: Run payment-order migration and isolated behavioral tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Create temporary local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-payment-order"
          cd "$RUNNER_TEMP/srk-payment-order"
          supabase init
          mkdir -p supabase/tests/database
          cp "$GITHUB_WORKSPACE/supabase/tests/database/atomic_razorpay_order_and_payment_finalization.test.sql" supabase/tests/database/
          cp "$GITHUB_WORKSPACE/supabase/tests/database/atomic_razorpay_order_behavior.test.sql" supabase/tests/database/

      - name: Start isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-payment-order
        run: supabase start

      - name: Prepare synthetic payment schema
        working-directory: ${{ runner.temp }}/srk-payment-order
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          supabase status -o env > "$RUNNER_TEMP/srk-payment-order.env"
          set -a
          source "$RUNNER_TEMP/srk-payment-order.env"
          set +a
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/fixtures/payment_order_bootstrap.sql"

      - name: Apply payment-order migration locally
        working-directory: ${{ runner.temp }}/srk-payment-order
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/srk-payment-order.env"
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114090000_atomic_razorpay_order_and_payment_finalization.sql"

      - name: Run structural and behavioral pgTAP tests
        working-directory: ${{ runner.temp }}/srk-payment-order
        run: supabase test db

      - name: Stop isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-payment-order
        if: always()
        run: supabase stop --no-backup
