name: Push notifications Deno check

on:
  push:
    branches:
      - feature/production-push-notifications
    paths:
      - "supabase/functions/push-job-offer/**"
      - ".github/workflows/push-notifications-deno-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/push-job-offer/**"
      - ".github/workflows/push-notifications-deno-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    name: Type-check push-job-offer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function
        run: deno check --no-lock supabase/functions/push-job-offer/index.ts
