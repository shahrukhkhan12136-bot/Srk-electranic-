name: AI idempotency atomicity PostgreSQL tests

on:
  push:
    branches: [feat/ai-rate-management-foundation-20261118]
    paths:
      - "COMPLETE_DATABASE_SETUP.sql"
      - "supabase/migrations/**"
      - "supabase/tests/database/ai_idempotency_atomicity.test.sql"
      - "scripts/test-ai-idempotency-concurrency.sh"
      - ".github/workflows/ai-idempotency-atomicity-pgtap.yml"
  pull_request:
    paths:
      - "COMPLETE_DATABASE_SETUP.sql"
      - "supabase/migrations/**"
      - "supabase/tests/database/ai_idempotency_atomicity.test.sql"
      - ".github/workflows/ai-idempotency-atomicity-pgtap.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: srk-ai-idempotency-atomicity-pgtap
  cancel-in-progress: false
jobs:
  pgtap:
    name: Replay full schema and exercise AI idempotency RPCs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Initialize disposable local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-ai-idempotency-pgtap"
          cd "$RUNNER_TEMP/srk-ai-idempotency-pgtap"
          supabase init
      - name: Start disposable local Supabase stack
        working-directory: ${{ runner.temp }}/srk-ai-idempotency-pgtap
        run: supabase start
      - name: Replay baseline and all feature migrations
        working-directory: ${{ runner.temp }}/srk-ai-idempotency-pgtap
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/COMPLETE_DATABASE_SETUP.sql"
          mapfile -t migrations < <(find "$GITHUB_WORKSPACE/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying $(basename "$migration")"
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Enable pgTAP and run 34 behavioral/security assertions
        working-directory: ${{ runner.temp }}/srk-ai-idempotency-pgtap
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          OUTPUT="$( { echo 'SET search_path = public, extensions;'; cat "$GITHUB_WORKSPACE/supabase/tests/database/ai_idempotency_atomicity.test.sql"; } | docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 2>&1)" || { printf '%s\\n' "$OUTPUT"; exit 1; }
          printf '%s\\n' "$OUTPUT"
          if printf '%s\\n' "$OUTPUT" | grep -Eq 'not ok [0-9]+|Looks like you failed [1-9]'; then exit 1; fi
          if ! printf '%s\\n' "$OUTPUT" | grep -Fq '1..34'; then
            echo "Expected pgTAP plan 1..34 was not found."
            exit 1
          fi
      - name: Run two-session same-key and different-key concurrency checks
        working-directory: ${{ runner.temp }}/srk-ai-idempotency-pgtap
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          bash "$GITHUB_WORKSPACE/scripts/test-ai-idempotency-concurrency.sh" "$DB_CONTAINER"

      - name: Stop disposable local Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}/srk-ai-idempotency-pgtap
        run: supabase stop --no-backup
