name: Full feature branch PostgreSQL migration replay

on:
  push:
    branches:
      - feat/ai-rate-management-foundation-20261118
    paths:
      - "COMPLETE_DATABASE_SETUP.sql"
      - "supabase/migrations/**"
      - "supabase/tests/database/rate_catalogue_draft_security.test.sql"
      - "supabase/tests/database/payout_reference_unique_index.test.sql"
      - "scripts/test-payout-reference-concurrency.sh"
      - "docs/AI_CONVERSATION_AND_HANDOFF_DATA_MODEL_HI.md"
      - ".github/workflows/full-migration-replay-postgres.yml"
  pull_request:
    paths:
      - "COMPLETE_DATABASE_SETUP.sql"
      - "supabase/migrations/**"
      - "supabase/tests/database/rate_catalogue_draft_security.test.sql"
      - "supabase/tests/database/payout_reference_unique_index.test.sql"
      - "scripts/test-payout-reference-concurrency.sh"
      - ".github/workflows/full-migration-replay-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-full-migration-replay-postgres
  cancel-in-progress: false

jobs:
  full-replay:
    name: Replay baseline plus every feature migration in disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Initialize temporary Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-full-migration-replay"
          cd "$RUNNER_TEMP/srk-full-migration-replay"
          supabase init
          # Keep disposable Supabase ports away from runner-level services.
          sed -i '/^port = 54321$/s/54321/61431/; /^port = 54322$/s/54322/61432/; /^shadow_port = 54320$/s/54320/61430/' supabase/config.toml

      - name: Start disposable local Supabase stack
        working-directory: ${{ runner.temp }}/srk-full-migration-replay
        run: supabase start --exclude mailpit

      - name: Replay baseline and every migration in deterministic filename order
        working-directory: ${{ runner.temp }}/srk-full-migration-replay
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          mkdir -p "$RUNNER_TEMP/srk-full-migration-evidence"
          LOG="$RUNNER_TEMP/srk-full-migration-evidence/replay.log"

          echo "Applying COMPLETE_DATABASE_SETUP.sql to disposable local PostgreSQL"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < "$GITHUB_WORKSPACE/COMPLETE_DATABASE_SETUP.sql" 2>&1 | tee "$LOG"

          mapfile -t migrations < <(find "$GITHUB_WORKSPACE/supabase/migrations" -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort)
          test "${#migrations[@]}" -gt 0
          printf 'migration_file_count=%s\\n' "${#migrations[@]}" | tee -a "$LOG"

          for migration in "${migrations[@]}"; do
            echo "===== APPLY: $(basename "$migration") =====" | tee -a "$LOG"
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "$migration" 2>&1 | tee -a "$LOG"
          done

          echo "===== FINAL SCHEMA CHECKS =====" | tee -a "$LOG"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "select 'amount_paid=' || (exists (select 1 from information_schema.columns where table_schema='public' and table_name='service_bookings' and column_name='amount_paid'))::text;
             select 'amount_paid_constraint=' || (exists (select 1 from pg_constraint where conrelid='public.service_bookings'::regclass and conname='service_bookings_amount_paid_nonnegative_check'))::text;
             select 'rate_catalogue_versions=' || (to_regclass('public.srk_rate_catalogue_versions') is not null)::text;
             select 'rate_catalogue_drafts=' || (to_regclass('public.srk_rate_catalogue_drafts') is not null)::text;
             select 'rate_draft_save_rpc=' || (to_regprocedure('public.srk_admin_save_rate_catalogue_draft(jsonb,timestamptz,text,uuid)') is not null)::text;
             select 'rate_draft_list_rpc=' || (to_regprocedure('public.srk_admin_list_rate_catalogue_drafts(integer)') is not null)::text;
             select 'rate_draft_publish_rpc=' || (to_regprocedure('public.srk_admin_publish_rate_catalogue_draft(uuid,uuid)') is not null)::text;
             select 'rate_catalogue_items=' || (to_regclass('public.srk_rate_catalogue_items') is not null)::text;
             select 'rate_catalogue_audit=' || (to_regclass('public.srk_rate_catalogue_audit') is not null)::text;
             select 'electrician_rate_categories=' || (to_regclass('public.srk_electrician_approved_rate_categories') is not null)::text;
             select 'electrician_rate_category_audit=' || (to_regclass('public.srk_electrician_rate_category_audit') is not null)::text;
             select 'rate_catalogue_rls=' || (coalesce((select bool_and(relrowsecurity) from pg_class where oid in ('public.srk_rate_catalogue_versions'::regclass,'public.srk_rate_catalogue_drafts'::regclass,'public.srk_rate_catalogue_items'::regclass,'public.srk_rate_catalogue_audit'::regclass,'public.srk_electrician_approved_rate_categories'::regclass,'public.srk_electrician_rate_category_audit'::regclass)),false))::text;
             select 'rate_publish_rpc=' || (to_regprocedure('public.srk_admin_publish_rate_catalogue(jsonb,timestamptz,uuid,text)') is not null)::text;
             select 'customer_rate_read_rpc=' || (to_regprocedure('public.srk_get_current_customer_rate_catalogue()') is not null)::text;
             select 'electrician_rate_read_rpc=' || (to_regprocedure('public.srk_get_my_electrician_rate_list()') is not null)::text;
             select 'admin_category_rpc=' || (to_regprocedure('public.srk_admin_list_electrician_rate_categories()') is not null)::text;
             select 'booking_snapshot_guard=' || (to_regprocedure('public.srk_guard_booking_rate_snapshot_immutable()') is not null)::text;
             select 'payout_reference_unique_index=' || (exists (select 1 from pg_index i join pg_class idx on idx.oid=i.indexrelid where i.indrelid='public.srk_electrician_payouts'::regclass and idx.relname='srk_electrician_payouts_unique_reference_normalized' and i.indisunique))::text;" | tee -a "$LOG"

          required_checks=(
            amount_paid=true
            amount_paid_constraint=true
            rate_catalogue_versions=true
            rate_catalogue_drafts=true
            rate_draft_save_rpc=true
            rate_draft_list_rpc=true
            rate_draft_publish_rpc=true
            rate_catalogue_items=true
            rate_catalogue_audit=true
            electrician_rate_categories=true
            electrician_rate_category_audit=true
            rate_catalogue_rls=true
            rate_publish_rpc=true
            customer_rate_read_rpc=true
            electrician_rate_read_rpc=true
            admin_category_rpc=true
            booking_snapshot_guard=true
            payout_reference_unique_index=true
          )
          for check in "${required_checks[@]}"; do
            if ! grep -q "$check" "$LOG"; then
              echo "Final schema assertion failed: $check" | tee -a "$LOG"
              exit 1
            fi
          done

      - name: Run Rate List Draft and Scheduled pgTAP security tests locally
        working-directory: ${{ runner.temp }}/srk-full-migration-replay
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          OUTPUT="$(docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < "$GITHUB_WORKSPACE/supabase/tests/database/rate_catalogue_draft_security.test.sql" 2>&1)" \
            || { printf '%s\\n' "$OUTPUT"; exit 1; }
          printf '%s\\n' "$OUTPUT"
          if printf '%s\\n' "$OUTPUT" | grep -Eq 'not ok [0-9]+|Looks like you failed [1-9]'; then
            echo "Rate List Draft pgTAP assertions failed."
            exit 1
          fi

      - name: Prove duplicate normalized payout references are rejected
        working-directory: ${{ runner.temp }}/srk-full-migration-replay
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          OUTPUT="$(docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < "$GITHUB_WORKSPACE/supabase/tests/database/payout_reference_unique_index.test.sql" 2>&1)" \
            || { printf '%s\\n' "$OUTPUT"; exit 1; }
          printf '%s\\n' "$OUTPUT"
          printf '%s\\n' "$OUTPUT" | grep -q 'payout_reference_duplicate_insert_rejected=true'
          printf '%s\\n' "$OUTPUT" | grep -q 'payout_reference_duplicate_fixture_count=1'

      - name: Prove concurrent duplicate payout reference writes are serialized
        working-directory: ${{ runner.temp }}/srk-full-migration-replay
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          bash "$GITHUB_WORKSPACE/scripts/test-payout-reference-concurrency.sh" "$DB_CONTAINER"

      - name: Upload PostgreSQL replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-feature-migration-replay-postgres
          path: ${{ runner.temp }}/srk-full-migration-evidence/
          if-no-files-found: warn

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}/srk-full-migration-replay
        run: supabase stop --no-backup
