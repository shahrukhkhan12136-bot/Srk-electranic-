name: Feature Branch Node tests

on:
  push:
    branches:
      - feat/customer-login-first-dashboard-20261114
      - feature/master-technician-payment-cycle-20261121
      - feature/master-gst-accounting-20261121
      - feature/master-rating-ui-followup-v2-20261121
      - tmp/master-final-ui-20261121
  pull_request:
    branches:
      - main
      - feature/master-gst-accounting-20261121
      - feature/master-rating-ui-followup-v2-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-node-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node test suite (no secrets, no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run repository Node tests
        run: npm test
