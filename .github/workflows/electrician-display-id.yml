name: Electrician Display ID Tests

on:
  workflow_dispatch:
  push:
    branches: [feature/production-push-notifications]
    paths:
      - 'supabase/migrations/20261112100000_permanent_electrician_display_ids.sql'
      - 'supabase/tests/electrician_display_id_assertions.sql'
      - 'supabase/tests/electrician_display_id_fixture.sql'
      - 'supabase/tests/electrician_display_id_behavior.sql'
      - '.github/workflows/electrician-display-id.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261112100000_permanent_electrician_display_ids.sql'
      - 'supabase/tests/electrician_display_id_assertions.sql'
      - 'supabase/tests/electrician_display_id_fixture.sql'
      - 'supabase/tests/electrician_display_id_behavior.sql'
      - '.github/workflows/electrician-display-id.yml'

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/tests/electrician_display_id_fixture.sql
      - name: Apply feature-branch migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112100000_permanent_electrician_display_ids.sql
      - name: Assert migration catalog and security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/tests/electrician_display_id_assertions.sql
      - name: Test issuance, immutability and client-supplied ID rejection
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/tests/electrician_display_id_behavior.sql
