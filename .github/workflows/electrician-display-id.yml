name: Electrician Display ID Tests

on:
  workflow_dispatch:
  push:
    branches: [feature/production-push-notifications]
    paths:
      - 'supabase/migrations/20261112100000_permanent_electrician_display_ids.sql'
      - 'supabase/tests/electrician_display_id_assertions.sql'
      - 'supabase/tests/electrician_display_id_fixture.sql'
      - 'supabase/tests/electrician_display_id_behavior.sql'
      - '.github/workflows/electrician-display-id.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261112100000_permanent_electrician_display_ids.sql'
      - 'supabase/tests/electrician_display_id_assertions.sql'
      - 'supabase/tests/electrician_display_id_fixture.sql'
      - 'supabase/tests/electrician_display_id_behavior.sql'
      - '.github/workflows/electrician-display-id.yml'

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax in electrician and Admin pages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          for (const file of ['electrician.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter(match => !/\bsrc\s*=/.test(match[1]));
            if (scripts.length === 0) throw new Error('No inline scripts found in ' + file);
            scripts.forEach((match, index) => {
              const result = spawnSync(process.execPath, ['--check', '-'], { input: match[2], encoding: 'utf8' });
              if (result.status !== 0) {
                process.stderr.write(file + ' inline script ' + (index + 1) + ':\n' + result.stderr);
                process.exit(result.status || 1);
              }
            });
            console.log(file + ': ' + scripts.length + ' inline script(s) passed syntax check');
          }
          NODE
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/tests/electrician_display_id_fixture.sql
      - name: Apply feature-branch migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112100000_permanent_electrician_display_ids.sql
      - name: Assert migration catalog and security
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/tests/electrician_display_id_assertions.sql
      - name: Test issuance, immutability and client-supplied ID rejection
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -f supabase/tests/electrician_display_id_behavior.sql
      - name: Stress concurrent ID issuance
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for i in $(seq 1 24); do
            phone=$(printf '9%09d' "$i")
            psql -h localhost -U postgres -d srk_test -v ON_ERROR_STOP=1 -c "with new_user as (insert into auth.users(id) values (gen_random_uuid()) returning id) insert into public.electrician_profiles (display_name,phone,state,district,pincode,verification_status,active,auth_user_id) select 'Concurrent Fixture $i','$phone','Uttar Pradesh','Balrampur','271861','approved',true,id from new_user" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          issued=$(psql -h localhost -U postgres -d srk_test -Atc "select count(*) from public.electrician_profiles where electrician_display_id is not null")
          distinct=$(psql -h localhost -U postgres -d srk_test -Atc "select count(distinct electrician_display_id) from public.electrician_profiles where electrician_display_id is not null")
          test "$issued" = "28"
          test "$distinct" = "$issued"
