name: SRK Master isolated Supabase migration and pgTAP validation

on:
  push:
    branches:
      - tmp/master-final-ui-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-master-supabase-validation
  cancel-in-progress: true

jobs:
  migration-test:
    name: Schema-only clone, Master migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Require dedicated schema-only export credential
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add a dedicated least-privilege schema-only export connection as the SUPABASE_DB_URL GitHub Actions secret. Never use postgres, service_role, or a BYPASSRLS account."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must be a PostgreSQL connection URI."; exit 1 ;;
          esac

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Create clean isolated local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-master-supabase"
          cd "$RUNNER_TEMP/srk-master-supabase"
          supabase init
          rm -rf supabase/migrations supabase/tests
          mkdir -p supabase/migrations supabase/tests/database
          cp "$GITHUB_WORKSPACE"/supabase/migrations/20261121*.sql supabase/migrations/
          cp "$GITHUB_WORKSPACE"/supabase/tests/database/*.test.sql supabase/tests/database/

      - name: Verify export credential cannot read rows or alter schema
        working-directory: ${{ runner.temp }}/srk-master-supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check-export-role.sql" <<'SQL'
          SELECT NOT (
            EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = current_user
                AND (rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb OR rolreplication)
            )
            OR EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
                AND c.relkind IN ('r', 'p', 'v', 'm', 'f')
                AND (
                  has_table_privilege(current_user, c.oid, 'SELECT')
                  OR has_any_column_privilege(current_user, c.oid, 'SELECT')
                  OR has_table_privilege(current_user, c.oid, 'INSERT,UPDATE,DELETE,TRUNCATE,TRIGGER')
                )
            )
            OR EXISTS (
              SELECT 1
              FROM pg_namespace n
              WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
                AND has_schema_privilege(current_user, n.oid, 'CREATE')
            )
          ) AS safe_schema_export_role;
          SQL
          supabase db query --remote="$SUPABASE_DB_URL" --read-only --output json "$(cat "$RUNNER_TEMP/check-export-role.sql")" > "$RUNNER_TEMP/export-role-check.json"
          if ! grep -Eiq '"safe_schema_export_role"[[:space:]]*:[[:space:]]*true' "$RUNNER_TEMP/export-role-check.json"; then
            echo "::error::Export account is too privileged or can access table rows. Use a dedicated schema-only export role."
            exit 1
          fi

      - name: Export production schema only (no customer or booking rows)
        working-directory: ${{ runner.temp }}/srk-master-supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          supabase db dump --remote="$SUPABASE_DB_URL" --schema=public,private --file "$RUNNER_TEMP/srk-master-production-schema.sql"
          test -s "$RUNNER_TEMP/srk-master-production-schema.sql"
          if grep -Eiq '^(COPY|INSERT INTO) ' "$RUNNER_TEMP/srk-master-production-schema.sql"; then
            echo "::error::Unexpected data statements found in schema-only export."
            exit 1
          fi

      - name: Start isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase start

      - name: Restore schema into isolated local database
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase db query --local --file "$RUNNER_TEMP/srk-master-production-schema.sql"

      - name: Apply all pending Master System migrations in timestamp order
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/20261121*.sql)
          if [ "${#migrations[@]}" -lt 1 ]; then
            echo "::error::No Master System migrations found."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying isolated migration: $migration"
            supabase db query --local --file "$migration"
          done

      - name: Lint isolated Master schema
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase db lint --local --fail-on error

      - name: Run Master System pgTAP database tests
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase test db supabase/tests/database

      - name: Stop isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-master-supabase
        if: always()
        run: supabase stop --no-backup
