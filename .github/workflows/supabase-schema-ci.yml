name: Customer Offer Timeline isolated pgTAP

on:
  workflow_dispatch:
  push:
    branches: [feature/platform-fee-cash-online-cycle]
    paths:
      - '.github/workflows/supabase-schema-ci.yml'
      - 'supabase/migrations/20261114230000_customer_safe_offer_timeline.sql'
      - 'supabase/tests/fixtures/customer_offer_timeline_bootstrap.sql'
      - 'supabase/tests/database/customer_safe_offer_timeline.test.sql'
      - 'supabase/tests/database/customer_safe_offer_timeline_behavior.test.sql'

permissions:
  contents: read

concurrency:
  group: srk-customer-offer-timeline-pgtap
  cancel-in-progress: true

jobs:
  isolated-pgtap:
    if: github.ref == 'refs/heads/feature/platform-fee-cash-online-cycle'
    name: Run offer timeline migration and owner-isolation tests locally
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Create temporary local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-offer-timeline"
          cd "$RUNNER_TEMP/srk-offer-timeline"
          supabase init
          mkdir -p supabase/tests/database
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_safe_offer_timeline.test.sql" supabase/tests/database/
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_safe_offer_timeline_behavior.test.sql" supabase/tests/database/

      - name: Start isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-offer-timeline
        run: supabase start

      - name: Prepare synthetic legacy schema and offer fixtures
        working-directory: ${{ runner.temp }}/srk-offer-timeline
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          supabase status -o env > "$RUNNER_TEMP/srk-supabase-local.env"
          set -a
          source "$RUNNER_TEMP/srk-supabase-local.env"
          set +a
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/fixtures/customer_offer_timeline_bootstrap.sql"

      - name: Apply Customer Offer Timeline migration locally
        working-directory: ${{ runner.temp }}/srk-offer-timeline
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/srk-supabase-local.env"
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114230000_customer_safe_offer_timeline.sql"

      - name: Run structural and behavioral pgTAP tests
        working-directory: ${{ runner.temp }}/srk-offer-timeline
        run: supabase test db supabase/tests/database/customer_safe_offer_timeline.test.sql supabase/tests/database/customer_safe_offer_timeline_behavior.test.sql

      - name: Stop isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-offer-timeline
        if: always()
        run: supabase stop --no-backup
