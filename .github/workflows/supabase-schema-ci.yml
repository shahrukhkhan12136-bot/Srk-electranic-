name: SRK Master isolated Supabase migration and pgTAP validation

on:
  push:
    branches:
      - tmp/master-final-ui-20261121
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-master-supabase-validation
  cancel-in-progress: true

jobs:
  migration-test:
    name: Bootstrap baseline, apply migrations and run pgTAP locally
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Create isolated local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-master-supabase"
          cd "$RUNNER_TEMP/srk-master-supabase"
          supabase init
          mkdir -p supabase/migrations supabase/tests/database
          cp "$GITHUB_WORKSPACE"/supabase/tests/database/*.test.sql supabase/tests/database/

      - name: Start isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase start

      - name: Restore checked-in SRK baseline schema (no production connection)
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/SUPABASE_SCHEMA.sql"
          test -s "$GITHUB_WORKSPACE/PORTAL_SCHEMA.sql"
          supabase db query --local --file "$GITHUB_WORKSPACE/SUPABASE_SCHEMA.sql"
          supabase db query --local --file "$GITHUB_WORKSPACE/PORTAL_SCHEMA.sql"

      - name: Apply every repository migration in timestamp order
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=("$GITHUB_WORKSPACE"/supabase/migrations/*.sql)
          if [ "${#migrations[@]}" -lt 1 ]; then
            echo "::error::No repository migrations found."
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying isolated migration: $migration"
            supabase db query --local --file "$migration"
          done

      - name: Lint isolated database schema
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase db lint --local --fail-on error

      - name: Run all pgTAP database tests
        working-directory: ${{ runner.temp }}/srk-master-supabase
        run: supabase test db supabase/tests/database

      - name: Stop isolated local Supabase stack
        working-directory: ${{ runner.temp }}/srk-master-supabase
        if: always()
        run: supabase stop --no-backup
