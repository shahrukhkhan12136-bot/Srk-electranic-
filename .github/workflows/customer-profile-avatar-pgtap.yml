name: Customer profile and avatar isolated pgTAP

on:
  workflow_dispatch:
  push:
    branches: [feature/platform-fee-cash-online-cycle]
    paths:
      - '.github/workflows/customer-profile-avatar-pgtap.yml'
      - 'supabase/migrations/20261113200000_customer_profile_api_and_avatar_security.sql'
      - 'supabase/migrations/20261114180000_harden_customer_avatar_object_integrity.sql'
      - 'supabase/tests/database/customer_profile_privacy.test.sql'
      - 'supabase/tests/database/customer_avatar_object_integrity.test.sql'

permissions:
  contents: read

concurrency:
  group: srk-customer-profile-avatar-pgtap
  cancel-in-progress: true

jobs:
  isolated-pgtap:
    if: github.ref == 'refs/heads/feature/platform-fee-cash-online-cycle'
    name: Test customer profile and avatar security locally
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Create disposable local Supabase project and copy pgTAP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-customer-profile-avatar"
          cd "$RUNNER_TEMP/srk-customer-profile-avatar"
          supabase init
          mkdir -p supabase/tests/database
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_profile_privacy.test.sql" supabase/tests/database/
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_avatar_object_integrity.test.sql" supabase/tests/database/

      - name: Start isolated local Supabase
        working-directory: ${{ runner.temp }}/srk-customer-profile-avatar
        run: supabase start

      - name: Apply customer profile and avatar migrations locally
        working-directory: ${{ runner.temp }}/srk-customer-profile-avatar
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/srk-customer-profile-avatar.env"
          set -a
          source "$RUNNER_TEMP/srk-customer-profile-avatar.env"
          set +a
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261113200000_customer_profile_api_and_avatar_security.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114180000_harden_customer_avatar_object_integrity.sql"

      - name: Run customer profile and avatar pgTAP tests
        working-directory: ${{ runner.temp }}/srk-customer-profile-avatar
        run: supabase test db

      - name: Stop isolated local Supabase
        working-directory: ${{ runner.temp }}/srk-customer-profile-avatar
        if: always()
        run: supabase stop --no-backup
