name: Customer category duration isolated pgTAP
# Test harness is deliberately local-only; no live Supabase credentials or project ref.

on:
  workflow_dispatch:
  push:
    branches: [feature/platform-fee-cash-online-cycle]
    paths:
      - '.github/workflows/customer-category-isolated-pgtap.yml'
      - 'supabase/migrations/20261114010000_customer_booking_category_and_duration.sql'
      - 'supabase/tests/fixtures/customer_category_bootstrap.sql'
      - 'supabase/tests/database/customer_booking_category_duration.test.sql'
      - 'supabase/tests/database/customer_category_behavior.test.sql'

permissions:
  contents: read

concurrency:
  group: srk-customer-category-pgtap
  cancel-in-progress: true

jobs:
  isolated-pgtap:
    if: github.ref == 'refs/heads/feature/platform-fee-cash-online-cycle'
    name: Apply category migration and run synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Create disposable local project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-category"
          cd "$RUNNER_TEMP/srk-category"
          supabase init
          mkdir -p supabase/tests/database
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_booking_category_duration.test.sql" supabase/tests/database/
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_category_behavior.test.sql" supabase/tests/database/
      - name: Start local Supabase
        working-directory: ${{ runner.temp }}/srk-category
        run: supabase start
      - name: Apply synthetic baseline
        working-directory: ${{ runner.temp }}/srk-category
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          supabase status -o env > "$RUNNER_TEMP/srk-category.env"
          set -a
          source "$RUNNER_TEMP/srk-category.env"
          set +a
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/fixtures/customer_category_bootstrap.sql"
      - name: Apply category and duration migration locally
        working-directory: ${{ runner.temp }}/srk-category
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/srk-category.env"
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114010000_customer_booking_category_and_duration.sql"
      - name: Run structural and behavioral pgTAP
        working-directory: ${{ runner.temp }}/srk-category
        run: supabase test db
      - name: Stop local Supabase
        working-directory: ${{ runner.temp }}/srk-category
        if: always()
        run: supabase stop --no-backup
