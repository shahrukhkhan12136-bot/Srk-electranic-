name: AI isolated PostgreSQL draft tests

on:
  push:
    branches:
      - feat/ai-rate-management-foundation-20261118
    paths:
      - "docs/drafts/ai_conversation_handoff_schema_draft.sql"
      - "docs/drafts/ai_conversation_handoff_schema_tests_draft.sql"
      - "docs/drafts/ai_conversation_rpc_functions_draft.sql"
      - "docs/drafts/ai_conversation_rpc_functions_tests_draft.sql"
      - ".github/workflows/ai-postgres-draft-tests.yml"
  pull_request:
    paths:
      - "docs/drafts/ai_conversation_handoff_schema_draft.sql"
      - "docs/drafts/ai_conversation_handoff_schema_tests_draft.sql"
      - "docs/drafts/ai_conversation_rpc_functions_draft.sql"
      - "docs/drafts/ai_conversation_rpc_functions_tests_draft.sql"
      - ".github/workflows/ai-postgres-draft-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-ai-postgres-draft-tests-global
  cancel-in-progress: false

jobs:
  isolated-postgres:
    name: Run AI schema drafts in disposable local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Initialize temporary local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-ai-db"
          cd "$RUNNER_TEMP/srk-ai-db"
          supabase init
          # Use isolated ports so stale or parallel local Supabase instances cannot collide.
          sed -i 's/^\([[:space:]]*port = \)54321$/\154321/' supabase/config.toml
          sed -i 's/^\([[:space:]]*port = \)54322$/\155432/' supabase/config.toml
          sed -i 's/^\([[:space:]]*shadow_port = \)54320$/\155430/' supabase/config.toml

      - name: Start disposable local database
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: supabase start

      - name: Enable pgTAP in the disposable database
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: |
          set -euo pipefail
          supabase db query --local --output json "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"

      - name: Apply AI schema draft locally only
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/docs/drafts/ai_conversation_handoff_schema_draft.sql"

      - name: Run 29 pgTAP assertions and require all to pass
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/docs/drafts/ai_conversation_handoff_schema_tests_draft.sql"

      - name: Apply private AI RPC draft locally only
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/docs/drafts/ai_conversation_rpc_functions_draft.sql"

      - name: Run 32 private RPC behavioral and privilege assertions
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          OUTPUT="$(docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$GITHUB_WORKSPACE/docs/drafts/ai_conversation_rpc_functions_tests_draft.sql" 2>&1)" || { printf '%s\\n' "$OUTPUT"; exit 1; }
          printf '%s\\n' "$OUTPUT"
          if printf '%s\\n' "$OUTPUT" | grep -Eq 'not ok [0-9]+|Looks like you failed [1-9]'; then
            echo "pgTAP reported failed assertions."
            exit 1
          fi

      - name: Stop disposable local database
        if: always()
        working-directory: ${{ runner.temp }}/srk-ai-db
        run: supabase stop --no-backup
