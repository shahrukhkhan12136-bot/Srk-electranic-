name: AI generation cost reconciliation Deno type check

on:
  push:
    branches:
      - feat/ai-rate-management-foundation-20261118
    paths:
      - "supabase/functions/ai-generation-cost-reconcile/**"
      - "supabase/functions/_shared/ai-generation-cost.mjs"
      - ".github/workflows/ai-generation-cost-reconcile-deno-check.yml"
  pull_request:
    paths:
      - "supabase/functions/ai-generation-cost-reconcile/**"
      - ".github/workflows/ai-generation-cost-reconcile-deno-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-ai-generation-cost-reconcile-deno-check
  cancel-in-progress: false

jobs:
  typecheck:
    name: Type-check AI generation cost reconciliation Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.7
      - name: Type-check worker without deployment or secrets
        run: deno check --config supabase/functions/ai-generation-cost-reconcile/deno.json supabase/functions/ai-generation-cost-reconcile/index.ts
