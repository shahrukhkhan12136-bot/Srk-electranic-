name: Customer payment and refund history isolated pgTAP

on:
  workflow_dispatch:
  push:
    branches: [feature/platform-fee-cash-online-cycle]
    paths:
      - '.github/workflows/customer-payment-history-isolated-pgtap.yml'
      - 'supabase/migrations/20261114200000_customer_payment_refund_history_rpc.sql'
      - 'supabase/migrations/20261114210000_customer_refund_history_pagination.sql'
      - 'supabase/tests/fixtures/customer_payment_history_bootstrap.sql'
      - 'supabase/tests/database/customer_payment_history.test.sql'
      - 'supabase/tests/database/customer_payment_history_behavior.test.sql'
      - 'supabase/tests/database/customer_refund_history_pagination.test.sql'

permissions:
  contents: read

concurrency:
  group: srk-customer-payment-history-pgtap
  cancel-in-progress: true

jobs:
  isolated-pgtap:
    if: github.ref == 'refs/heads/feature/platform-fee-cash-online-cycle'
    name: Test customer payment and refund history locally
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Create disposable local project and copy pgTAP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srk-payment-history"
          cd "$RUNNER_TEMP/srk-payment-history"
          supabase init
          mkdir -p supabase/tests/database
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_payment_history.test.sql" supabase/tests/database/
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_payment_history_behavior.test.sql" supabase/tests/database/
          cp "$GITHUB_WORKSPACE/supabase/tests/database/customer_refund_history_pagination.test.sql" supabase/tests/database/
      - name: Start isolated local Supabase
        working-directory: ${{ runner.temp }}/srk-payment-history
        run: supabase start
      - name: Install PostgreSQL client and bootstrap synthetic schema
        working-directory: ${{ runner.temp }}/srk-payment-history
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          supabase status -o env > "$RUNNER_TEMP/srk-payment-history.env"
          set -a
          source "$RUNNER_TEMP/srk-payment-history.env"
          set +a
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/fixtures/customer_payment_history_bootstrap.sql"
      - name: Apply customer payment and refund history migrations
        working-directory: ${{ runner.temp }}/srk-payment-history
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/srk-payment-history.env"
          set +a
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114200000_customer_payment_refund_history_rpc.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261114210000_customer_refund_history_pagination.sql"
      - name: Run payment and refund history pgTAP suites
        working-directory: ${{ runner.temp }}/srk-payment-history
        run: supabase test db
      - name: Stop local Supabase
        working-directory: ${{ runner.temp }}/srk-payment-history
        if: always()
        run: supabase stop --no-backup
