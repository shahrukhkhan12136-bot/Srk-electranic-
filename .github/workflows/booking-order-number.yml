name: Verify live effective rate selection in booking RPC
on:
  push:
    branches: ["feature/production-push-notifications"]
    paths:
      - "supabase/migrations/20261112110000_customer_booking_order_numbers.sql"
      - "supabase/migrations/20261112130000_customer_booking_date_only.sql"
      - "supabase/migrations/20261112140000_customer_booking_duration_pricing.sql"
      - "supabase/migrations/20261112150000_versioned_rate_catalogue.sql"
      - "supabase/migrations/20261112160000_admin_rate_catalogue_management.sql"
      - "supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql"
      - "supabase/tests/booking_order_number_fixture.sql"
      - "supabase/tests/customer_booking_date_only_rpc_assertions.sql"
      - "supabase/tests/booking_order_number_assertions.sql"
      - ".github/workflows/booking-order-number.yml"
      - "create-booking.js"
      - "tests/create-booking-date-only.test.js"
      - "tests/create-booking-security.test.js"
      - "tests/customer-booking-date-only-ui.test.js"
      - "netlify/functions/create-booking.js"
      - "index.html"
      - "electrician.html"
      - "admin.html"
      - "apps/mobile-poc/customer/www/index.html"
  pull_request:
    paths:
      - "supabase/migrations/20261112140000_customer_booking_duration_pricing.sql"
      - "tests/create-booking-date-only.test.js"
      - "supabase/tests/customer_booking_date_only_rpc_assertions.sql"
      - "supabase/migrations/20261112110000_customer_booking_order_numbers.sql"
      - "supabase/migrations/20261112130000_customer_booking_date_only.sql"
      - "supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql"
      - "supabase/tests/booking_order_number_fixture.sql"
      - "supabase/tests/booking_order_number_assertions.sql"
      - ".github/workflows/booking-order-number.yml"
      - "create-booking.js"
      - "netlify/functions/create-booking.js"
      - "index.html"
      - "electrician.html"
      - "admin.html"
      - "tests/customer-booking-date-only-ui.test.js"
      - "tests/create-booking-security.test.js"
      - "apps/mobile-poc/customer/www/index.html"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_order_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_order_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check booking handler and customer/electrician/Admin JavaScript syntax
        run: |
          node --check create-booking.js
          node --check netlify/functions/create-booking.js
          node --test tests/create-booking-date-only.test.js tests/customer-booking-date-only-ui.test.js tests/create-booking-security.test.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const file of ['index.html', 'electrician.html', 'admin.html', 'apps/mobile-poc/customer/www/index.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [];
            for (const chunk of html.split(/<script\b/i).slice(1)) {
              const tagEnd = chunk.indexOf('>');
              const close = chunk.toLowerCase().indexOf('</script>');
              if (tagEnd < 0 || close < 0) continue;
              if (/\bsrc\s*=/i.test(chunk.slice(0, tagEnd))) continue;
              scripts.push(chunk.slice(tagEnd + 1, close));
            }
            scripts.forEach((source, index) => new vm.Script(source, { filename: file + '#inline-' + index }));
            console.log(file + ': ' + scripts.length + ' inline script(s) passed syntax check');
          }
          NODE
      - name: Build disposable Production-shaped schema
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/tests/booking_order_number_fixture.sql
      - name: Apply order-number migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112110000_customer_booking_order_numbers.sql
      - name: Apply date-only customer booking RPC migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112130000_customer_booking_date_only.sql
      - name: Apply customer duration pricing migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112140000_customer_booking_duration_pricing.sql
      - name: Apply append-only versioned rate catalogue migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112150000_versioned_rate_catalogue.sql
      - name: Apply admin rate catalogue management migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112160000_admin_rate_catalogue_management.sql
      - name: Apply electrician offer RPC migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql
      - name: Verify safe replay of all three migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112110000_customer_booking_order_numbers.sql
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112130000_customer_booking_date_only.sql
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112140000_customer_booking_duration_pricing.sql
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112150000_versioned_rate_catalogue.sql
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112160000_admin_rate_catalogue_management.sql
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql
      - name: Assert numbering, immutability, uniqueness, RPC scope and PII privacy
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/tests/booking_order_number_assertions.sql
      - name: Assert date-only and legacy-time customer booking RPC behavior
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/tests/customer_booking_date_only_rpc_assertions.sql
