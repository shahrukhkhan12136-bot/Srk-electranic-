name: Booking order number SQL tests
on:
  push:
    branches: ["feature/production-push-notifications"]
    paths:
      - "supabase/migrations/20261112110000_customer_booking_order_numbers.sql"
      - "supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql"
      - "supabase/tests/booking_order_number_fixture.sql"
      - "supabase/tests/booking_order_number_assertions.sql"
      - ".github/workflows/booking-order-number.yml"
  pull_request:
    paths:
      - "supabase/migrations/20261112110000_customer_booking_order_numbers.sql"
      - "supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql"
      - "supabase/tests/booking_order_number_fixture.sql"
      - "supabase/tests/booking_order_number_assertions.sql"
      - ".github/workflows/booking-order-number.yml"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srk_order_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srk_order_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable Production-shaped schema
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/tests/booking_order_number_fixture.sql
      - name: Apply order-number migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112110000_customer_booking_order_numbers.sql
      - name: Apply electrician offer RPC migration
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql
      - name: Verify safe replay of both migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112110000_customer_booking_order_numbers.sql
          psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112120000_electrician_offer_order_number_rpc.sql
      - name: Assert numbering, immutability, uniqueness, RPC scope and PII privacy
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@localhost:5432/srk_order_test" -v ON_ERROR_STOP=1 -f supabase/tests/booking_order_number_assertions.sql
