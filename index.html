<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2b">
<meta name="description" content="SRK ELECTRONIC सुरक्षित लॉगिन">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>SRK ELECTRONIC — सुरक्षित लॉगिन</title>
<style>
:root{color-scheme:dark;--navy:#071a2b;--blue:#123f68;--gold:#ffbd45;--white:#f7f9fc;--muted:#d5e1ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#174b78 0%,var(--navy) 66%);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:min(100%,760px);text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px}
.logo{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 12px 24px #0005)}
h1{font-size:clamp(29px,7vw,44px);line-height:1.12;letter-spacing:.035em;margin:0;font-weight:850}
.tagline{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.6}
h2{font-size:18px;margin:0 0 16px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role{min-height:154px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 14px;border:1px solid #ffffff2b;border-radius:18px;background:#ffffff0d;color:var(--white);text-decoration:none;box-shadow:0 12px 32px #0000001a;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.role:hover,.role:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:#ffffff17;outline:none}
.role-icon{font-size:30px;line-height:1}
.role-title{font-size:16px;font-weight:800}
.role-note{font-size:12px;color:var(--muted);line-height:1.45}
footer{margin-top:22px;color:#b9c9d9;font-size:12px}
@media(max-width:620px){.roles{grid-template-columns:1fr;gap:10px}.role{min-height:92px;display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;justify-items:start;text-align:left;padding:16px 18px}.role-icon{grid-row:1/3;font-size:27px}.role-title{align-self:end}.role-note{align-self:start}.logo{width:88px;height:88px}}
</style>
</head>
<body>
<main>
 <header class="brand">
  <img class="logo" src="/icon.svg" alt="SRK ELECTRONIC लोगो" width="104" height="104">
  <div>
   <h1>SRK ELECTRONIC</h1>
   <p class="tagline">आगे बढ़ने के लिए अपना सुरक्षित लॉगिन चुनें।</p>
  </div>
 </header>
 <section aria-labelledby="login-heading">
  <h2 id="login-heading">लॉगिन चुनें</h2>
  <nav class="roles" aria-label="सुरक्षित लॉगिन विकल्प">
   <a class="role" href="/booking.html">
    <span class="role-icon" aria-hidden="true">👤</span>
    <span class="role-title">Customer Login</span>
    <span class="role-note">मोबाइल OTP से ग्राहक सिस्टम खोलें</span>
   </a>
   <a class="role" href="/electrician.html">
    <span class="role-icon" aria-hidden="true">🧰</span>
    <span class="role-title">Electrician Login</span>
    <span class="role-note">सत्यापित पार्टनर OTP से लॉगिन करें</span>
   </a>
   <a class="role" href="/admin.html">
    <span class="role-icon" aria-hidden="true">🔐</span>
    <span class="role-title">Admin Login</span>
    <span class="role-note">केवल अधिकृत Main Admin के लिए</span>
   </a>
  </nav>
 </section>
 <footer>सुरक्षित लॉगिन • आपकी भूमिका के अनुसार सीमित पहुँच</footer>
</main>
</body>
</html>
