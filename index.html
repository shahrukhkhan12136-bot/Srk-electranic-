<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2b">
<meta name="description" content="SRK ELECTRONIC — वायरिंग, इलेक्ट्रिकल रिपेयर और फिटिंग सेवाएँ।">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>SRK ELECTRONIC</title>
<style>
:root{color-scheme:dark;--navy:#071a2b;--blue:#123f68;--gold:#ffbd45;--white:#f7f9fc;--muted:#d5e1ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at 50% 0%,#174b78 0%,var(--navy) 62%);color:var(--white);display:grid;place-items:center;padding:28px 18px}
main{width:min(100%,760px);text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:34px}
.logo{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 12px 24px #0005)}
h1{font-size:clamp(30px,7vw,48px);line-height:1.12;letter-spacing:.045em;margin:0;font-weight:850}
.tagline{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:1.6}
.promos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:30px auto 0;max-width:620px}
.promo{min-height:100px;display:grid;place-items:center;padding:18px 14px;border:1px solid #ffffff24;border-radius:18px;background:#ffffff0d;color:var(--white);font-size:16px;font-weight:700;line-height:1.45;box-shadow:0 10px 30px #00000012}
.promo span{display:block;color:var(--gold);font-size:25px;margin-bottom:7px}
@media(max-width:420px){.promos{gap:9px}.promo{font-size:14px;padding:14px 10px;min-height:94px}.logo{width:96px;height:96px}}
</style>
</head>
<body>
<main>
 <header class="brand">
  <img class="logo" src="/icon.svg" alt="SRK ELECTRONIC लोगो" width="112" height="112">
  <div>
   <h1>SRK ELECTRONIC</h1>
   <p class="tagline">आपकी इलेक्ट्रिकल सेवाओं का भरोसेमंद नाम</p>
  </div>
 </header>
 <section class="promos" aria-label="हमारी इलेक्ट्रिकल सेवाएँ">
  <div class="promo"><div><span>⚡</span>घर की वायरिंग और फिटिंग</div></div>
  <div class="promo"><div><span>🔧</span>इलेक्ट्रिकल रिपेयर सेवा</div></div>
  <div class="promo"><div><span>💡</span>लाइट और पंखे की फिटिंग</div></div>
  <div class="promo"><div><span>🏠</span>घरेलू इलेक्ट्रिकल मेंटेनेंस</div></div>
 </section>
 <p style="margin:28px 0 0"><a href="/booking.html" style="display:inline-block;margin:6px;padding:13px 20px;border-radius:12px;background:#ffbd45;color:#071a2b;text-decoration:none;font-weight:800">ग्राहक बुकिंग करें</a><a href="/apply-electrician.html" style="display:inline-block;margin:6px;padding:13px 20px;border:1px solid #ffffff55;border-radius:12px;color:#f7f9fc;text-decoration:none;font-weight:700">इलेक्ट्रिशियन पार्टनर बनें</a></p>
</main>
</body>
</html>
